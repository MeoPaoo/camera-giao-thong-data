name: Đồng bộ danh mục camera

on:
  schedule:
    - cron: "17 20 * * *" # 03:17 giờ Việt Nam mỗi ngày
  workflow_dispatch: # cho phép bấm "Run workflow" để chạy ngay

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Lỗi tải/dữ liệu bất thường → script dừng với mã lỗi, file không bị ghi đè.
      - name: Đồng bộ với cổng giao thông
        run: python -I sync_catalog.py

      - name: Kiểm tra danh mục
        run: python -I sync_catalog.py --check

      - name: Lưu thay đổi
        run: |
          if git diff --quiet -- docs/cameras.json; then
            echo "Danh mục không đổi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cameras.json
          git commit -m "Cập nhật danh mục camera $(date -u +%F)"
          git push
